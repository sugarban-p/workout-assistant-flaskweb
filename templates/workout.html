<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Records</title>
    <link rel="stylesheet" href="/static/demo.css" />
  </head>
  <body>
    <div class="back">
      <nav class="navbar">
        <div class="navbar-container">
          <div class="logo">
            <a href="{{ url_for('home.welcome') }}">Home</a>
          </div>
          <ul class="navbar-ul">
            {% if g.user %}
            <li class="dropdown">
              <a href="{{ url_for('workout') }}" class="dropbtn">健身專區</a>
              <div class="dropdown-content">
                <a
                  href="{{ url_for('home.plank') }}"
                  onclick="sendPose('plank')"
                  >棒式</a
                >
                <a
                  href="{{ url_for('home.dumbbell') }}"
                  onclick="sendPose('dumbbell')"
                  >二頭肌彎舉</a
                >
                <a
                  href="{{ url_for('home.wallsit') }}"
                  onclick="sendPose('wallsit')"
                  >靠牆蹲</a
                >
                <a
                  href="{{ url_for('home.squat') }}"
                  onclick="sendPose('squat')"
                  >深蹲</a
                >
                <a
                  href="{{ url_for('home.situp') }}"
                  onclick="sendPose('situp')"
                  >仰臥起坐</a
                >
                <a
                  href="{{ url_for('home.pushup') }}"
                  onclick="sendPose('pushup')"
                  >伏地挺身</a
                >
              </div>
            </li>
            <li>
              <a href="{{ url_for('data') }}">數據記錄</a>
            </li>
            <li>
              <a href="{{ url_for('auth.logout') }}">登出</a>
            </li>
            {% else %}
            <li>
              <a href="{{ url_for('workout') }}">健身專區</a>
            </li>
            <li>
              <a href="{{ url_for('auth.register') }}">註冊帳號</a>
            </li>
            <li>
              <a href="{{ url_for('auth.login') }}">登入</a>
              {% endif %}
            </li>
          </ul>
        </div>
      </nav>
    </div>
    <div class="articlebody">
      <div id="articles" class="articles">
        {% for article in articles %}
        <div class="article">
          <div class="left-section">
            <h2>{{ article.title }}</h2>
          </div>
          <div class="vl"></div>
          <div class="center-section">
            <ol>
              {% for step in article.content %}
              <li>
                <h4>{{ step }}</h4>
              </li>
              {% endfor %}
              <a href="{{ article.youtube }}" target="_blank">影片教學連結</a>
            </ol>
          </div>
          <div class="vl"></div>
          <div class="right-section">
            <div class="imgarea">
              <img src="{{ article.image }}" alt="Article Image" />
            </div>

            <a
              class="goworkout"
              href="{{ article.url }}"
              onclick="sendPose('{{article.sendPose}}')"
            >
              <button>運動去</button></a
            >
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
  <script src="../static/sendpose.js"></script>
</html>
