<!DOCTYPE html>
<title>project</title>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/fitness.css">
</head>

<body>

  <div class="back">
    <nav class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <a href="{{ url_for('home.welcome') }}">Home</a>
        </div>
        <ul class="navbar-ul">
          <li class="dropdown">
            <a href="{{ url_for('workout') }}" class="dropbtn">健身專區</a>
            <div class="dropdown-content">
              <a href="{{ url_for('home.plank') }}" onclick="sendPose('plank')">棒式</a>
              <a href="{{ url_for('home.dumbbell') }}" onclick="sendPose('dumbbell')">二頭肌彎舉</a>
              <a href="{{ url_for('home.wallsit') }}" onclick="sendPose('wallsit')">靠牆蹲</a>
              <a href="{{ url_for('home.squat') }}" onclick="sendPose('squat')">深蹲</a>
              <a href="{{ url_for('home.situp') }}" onclick="sendPose('situp')">仰臥起坐</a>
              <a href="{{ url_for('home.pushup') }}" onclick="sendPose('pushup')">伏地挺身</a>
            </div>
          </li>
          <li>
            <a href="{{ url_for('data') }}">數據記錄</a>
          </li>
          <li>
            <a href="{{ url_for('auth.logout') }}">登出</a>
          </li>
          </li>
        </ul>
      </div>
    </nav>

    {% block instruction %} {% endblock %}

    <div class="header-image">
      <div class="membership">
        <div id="camera-container"></div>
      </div>
    </div>
  </div>

</body>

<script src="../static/sendpose.js"></script>
</html>
