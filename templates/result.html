<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/data.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0/dist/chartjs-adapter-moment.min.js"></script>
    <style>
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .chart-legend div {
            margin-right: 10px;
            font-size: 14px;
        }
        .chart-legend span {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="back">
        <nav class="navbar">
            <div class="navbar-container">
                <div class="logo">
                    <a href="{{ url_for('index') }}">Home</a>
                </div>
                <ul class="navbar-ul">
                    <li class="dropdown">
                        <a href="{{ url_for('workout') }}" class="dropbtn">健身專區</a>
                        <div class="dropdown-content">
                            <a href="{{ url_for('home.plank') }}" onclick="sendPose('plank')">棒式</a>
                            <a href="{{ url_for('home.dumbbell') }}" onclick="sendPose('dumbbell')">二頭肌彎舉</a>
                            <a href="{{ url_for('home.wallsit') }}" onclick="sendPose('wallsit')">靠牆蹲</a>
                            <a href="{{ url_for('home.squat') }}" onclick="sendPose('squat')">深蹲</a>
                            <a href="{{ url_for('home.situp') }}" onclick="sendPose('situp')">仰臥起坐</a>
                            <a href="{{ url_for('home.pushup') }}" onclick="sendPose('pushup')">伏地挺身</a>
                        </div>
                    </li>
                    <li><a href="{{ url_for('data') }}">數據記錄</a></li>
                    <li><a href="{{ url_for('auth.logout') }}">登出</a></li>
                </ul>
            </div>
        </nav>

        <div class="container mt-5">
            <h1 class="text-center mb-5">Workout Records</h1>

            <div class="row">
                <div class="col-md-6">
                    <div class="chart-container">
                        <h2 class="text-center mb-4">各姿勢次數分佈</h2>
                        <div id="barChartLegend" class="chart-legend"></div> <!-- Added legend container -->
                        <canvas id="barChart"></canvas>
                        <div id="barChartCounts" class="percentage-box"></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="chart-container">
                        <h2 class="text-center mb-4">各姿勢總時間</h2>
                        <canvas id="pieChart"></canvas>
                        <div id="pieChartTimes" class="percentage-box"></div>
                    </div>
                </div>
            </div>

            <div class="row mt-5">
                <div class="col-12">
                    <div class="chart-container">
                        <h2 class="text-center mb-4">每日姿勢時間</h2>
                        <canvas id="dailyPoseChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                console.log("Chart Data:", chartData, "{{ chart_data | safe }}");
                var chartData = JSON.parse('{{ chart_data | tojson | safe}}');

                if (chartData && chartData.poses.length > 0) {
                    var chartColors = [
                        "rgba(255, 99, 132, 0.8)",
                        "rgba(54, 162, 235, 0.8)",
                        "rgba(255, 206, 86, 0.8)",
                        "rgba(75, 192, 192, 0.8)",
                        "rgba(153, 102, 255, 0.8)",
                        "rgba(255, 159, 64, 0.8)",
                        "rgba(201, 203, 207, 0.8)",
                    ];

                    var ctxBar = document.getElementById("barChart").getContext("2d");
                    var barChart = new Chart(ctxBar, {
                        type: "bar",
                        data: {
                            labels: chartData.poses,
                            datasets: [
                                {
                                    label: "次數",
                                    data: chartData.poseCounts,
                                    backgroundColor: chartColors,
                                },
                            ],
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                },
                            },
                            plugins: {
                                legend: {
                                    display: false,
                                },
                            },
                        },
                    });

                    var barChartCounts = document.getElementById("barChartCounts");
                    barChart.data.labels.forEach((label, index) => {
                        var value = barChart.data.datasets[0].data[index];
                        var div = document.createElement("div");
                        div.innerHTML = `${label}: ${value} 次`;
                        barChartCounts.appendChild(div);
                    });

                    // Add legend for bar chart
                    var barChartLegend = document.getElementById("barChartLegend");
                    chartData.poses.forEach((pose, index) => {
                        var color = chartColors[index % chartColors.length];
                        var div = document.createElement("div");
                        div.innerHTML = `<span style="background-color: ${color};"></span>${pose}`;
                        barChartLegend.appendChild(div);
                    });

                    var ctxPie = document.getElementById("pieChart").getContext("2d");
                    var pieChart = new Chart(ctxPie, {
                        type: "pie",
                        data: {
                            labels: chartData.poses,
                            datasets: [
                                {
                                    data: chartData.poseTotalTimes,
                                    backgroundColor: chartColors,
                                },
                            ],
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                tooltip: {
                                    callbacks: {
                                        label: function (context) {
                                            var label = context.label || "";
                                            var value = context.parsed || 0;
                                            var total = context.dataset.data.reduce((a, b) => a + b, 0);
                                            var percentage = ((value / total) * 100).toFixed(2) + "%";
                                            return label + ": " + value + " (" + percentage + ")";
                                        },
                                    },
                                },
                            },
                        },
                    });

                    var pieChartTimes = document.getElementById("pieChartTimes");
                    pieChart.data.labels.forEach((label, index) => {
                        var value = pieChart.data.datasets[0].data[index];
                        var div = document.createElement("div");
                        div.innerHTML = `${label}: ${value} 秒`;
                        pieChartTimes.appendChild(div);
                    });

                    // 新增的部分：每日姿勢總時間長條圖
                    var dailyCtx = document.getElementById("dailyPoseChart").getContext("2d");
                    var dailyPoseChart = new Chart(dailyCtx, {
                        type: "bar",
                        data: {
                            labels: chartData.dates, // 日期標籤
                            datasets: chartData.dailyPoses.map((pose, index) => ({
                                label: pose.name,
                                data: pose.times,
                                backgroundColor: chartColors[index % chartColors.length],
                            })),
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: "時間 (秒)"
                                    }
                                },
                            },
                            plugins: {
                                tooltip: {
                                    callbacks: {
                                        label: function (context) {
                                            var label = context.dataset.label || "";
                                            var value = context.parsed.y || 0;
                                            return label + ": " + value + " 秒";
                                        },
                                    },
                                },
                            },
                        },
                    });

                } else {
                    console.error("Chart data is not valid or poses are empty.");
                }
            });
        </script>
    </div>
    <script src="../static/sendpose.js"></script>
</body>
</html>
